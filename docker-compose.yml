services:
  db:
    image: postgres:16-alpine
    container_name: astromath-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astromath
    volumes:
      - astromath_pgdata:/var/lib/postgresql/data

volumes:
  astromath_pgdata:
